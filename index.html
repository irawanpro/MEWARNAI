<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Game Mewarnai Buah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    :root { --toolbar-h: 88px; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      font-family: sans-serif;
    }
    #gameWrapper { position: relative; width: 100%; height: 100%; }
    canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: calc(100% - var(--toolbar-h));
      touch-action: none;
    }
    #toolbar {
      position: absolute; bottom: 0; left: 0; width: 100%; height: var(--toolbar-h);
      background: #eee; display: flex; align-items: center; justify-content: space-around;
    }
    .color-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid #333; cursor: pointer;
    }
    #fruitName {
      position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.7); padding: 4px 12px; border-radius: 12px;
      font-weight: bold;
    }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: white; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 10;
    }
    #overlay h1 { margin-bottom: 20px; }
    #overlay button { padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>
<div id="gameWrapper">
  <div id="overlay">
    <h1>Game Mewarnai Buah</h1>
    <button onclick="startGame()">Mulai</button>
  </div>
  <div id="fruitName"></div>
  <canvas id="outlineCanvas"></canvas>
  <canvas id="paintCanvas"></canvas>
  <div id="toolbar">
    <button onclick="prevFruit()">⏮</button>
    <button onclick="clearPaint()">Clear</button>
    <button onclick="nextFruit()">⏭</button>
    <div id="colors"></div>
  </div>
</div>
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>
<script>
  const fruits = [
    { name: "Apel", src: "apel.png" },
    { name: "Jeruk", src: "jeruk.png" },
    { name: "Pisang", src: "pisang.png" }
  ];
  const colors = ["red","green","blue","yellow","orange","purple","brown","pink"];
  let currentFruitIndex = 0;
  let drawing = false;
  let currentColor = "black";
  const outlineCanvas = document.getElementById("outlineCanvas");
  const paintCanvas = document.getElementById("paintCanvas");
  const outlineCtx = outlineCanvas.getContext("2d");
  const paintCtx = paintCanvas.getContext("2d");
  const fruitNameEl = document.getElementById("fruitName");
  const outlineImg = new Image();
  const bgMusic = document.getElementById("bgMusic");

  function resizeCanvas() {
    outlineCanvas.width = paintCanvas.width = window.innerWidth;
    outlineCanvas.height = paintCanvas.height = window.innerHeight - 88;
    drawOutline();
  }
  window.onresize = resizeCanvas;

  function drawOutline() {
    outlineCtx.clearRect(0, 0, outlineCanvas.width, outlineCanvas.height);
    outlineCtx.drawImage(outlineImg, 0, 0, outlineCanvas.width, outlineCanvas.height);
  }

  function loadFruit(index) {
    currentFruitIndex = (index + fruits.length) % fruits.length;
    fruitNameEl.textContent = fruits[currentFruitIndex].name;
    clearPaint();
    outlineImg.onload = () => {
      drawOutline();

      // === Tambahan: Buat clipping mask di paintCanvas ===
      paintCtx.restore?.(); // reset clip sebelumnya jika ada
      paintCtx.save();
      paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      
      // gambar outline sementara
      paintCtx.drawImage(outlineImg, 0, 0, paintCanvas.width, paintCanvas.height);
      const imgData = paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height);
      paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);

      paintCtx.beginPath();
      for (let y = 0; y < imgData.height; y++) {
        for (let x = 0; x < imgData.width; x++) {
          let idx = (y * imgData.width + x) * 4 + 3; // alpha channel
          if (imgData.data[idx] > 0) {
            paintCtx.rect(x, y, 1, 1);
          }
        }
      }
      paintCtx.clip(); // aktifkan mask
    };
    outlineImg.src = fruits[currentFruitIndex].src;
  }

  function prevFruit() { loadFruit(currentFruitIndex - 1); }
  function nextFruit() { loadFruit(currentFruitIndex + 1); }
  function clearPaint() { paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height); }

  function startDraw(e) {
    drawing = true;
    paintCtx.beginPath();
    paintCtx.moveTo(getX(e), getY(e));
  }
  function draw(e) {
    if (!drawing) return;
    paintCtx.lineTo(getX(e), getY(e));
    paintCtx.strokeStyle = currentColor;
    paintCtx.lineWidth = 10;
    paintCtx.lineCap = "round";
    paintCtx.lineJoin = "round";
    paintCtx.stroke();
  }
  function endDraw(e) { drawing = false; paintCtx.closePath(); }
  function getX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
  function getY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

  paintCanvas.addEventListener("mousedown", startDraw);
  paintCanvas.addEventListener("mousemove", draw);
  paintCanvas.addEventListener("mouseup", endDraw);
  paintCanvas.addEventListener("touchstart", startDraw);
  paintCanvas.addEventListener("touchmove", draw);
  paintCanvas.addEventListener("touchend", endDraw);

  function buildColors() {
    const colorDiv = document.getElementById("colors");
    colors.forEach(c => {
      let btn = document.createElement("div");
      btn.className = "color-btn";
      btn.style.background = c;
      btn.onclick = () => currentColor = c;
      colorDiv.appendChild(btn);
    });
  }

  function startGame() {
    document.getElementById("overlay").style.display = "none";
    resizeCanvas();
    buildColors();
    loadFruit(currentFruitIndex);
    bgMusic.play();
  }
</script>
</body>
</html>
