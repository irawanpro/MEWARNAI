<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Game Mewarnai Buah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    :root { --toolbar-h: 88px; }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    #gameContainer {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    #toolbar {
      height: var(--toolbar-h);
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .color-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid #333;
      margin: 0 4px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="outlineCanvas"></canvas>
    <canvas id="paintCanvas"></canvas>
  </div>
  <div id="toolbar">
    <button onclick="prevFruit()">Sebelumnya</button>
    <span id="fruitName"></span>
    <button onclick="nextFruit()">Berikutnya</button>
    <input type="color" id="colorPicker" />
    <button onclick="clearPaint()">Hapus</button>
  </div>

  <script>
    const outlineCanvas=document.getElementById('outlineCanvas');
    const paintCanvas=document.getElementById('paintCanvas');
    const outlineCtx=outlineCanvas.getContext('2d');
    const paintCtx=paintCanvas.getContext('2d');
    const fruitNameEl=document.getElementById('fruitName');
    const colorPicker=document.getElementById('colorPicker');
    let brushColor='#000000';
    let brushSize=5;
    let drawing=false;
    let outlineImg=new Image();
    let currentFruitIndex=0;
    const fruitList=[
      {name:"Apel", src:"assets/apel.png"},
      {name:"Pisang", src:"assets/pisang.png"},
      {name:"Jeruk", src:"assets/jeruk.png"}
    ];

    function resizeCanvas(){
      outlineCanvas.width=paintCanvas.width=gameContainer.clientWidth;
      outlineCanvas.height=paintCanvas.height=gameContainer.clientHeight;
      drawOutline();
    }
    window.addEventListener('resize', resizeCanvas);

    function drawOutline(){
      outlineCtx.clearRect(0,0,outlineCanvas.width,outlineCanvas.height);
      outlineCtx.drawImage(outlineImg,0,0,outlineCanvas.width,outlineCanvas.height);
    }

    function loadFruit(index){
      currentFruitIndex=(index+fruitList.length)%fruitList.length;
      fruitNameEl.textContent=fruitList[currentFruitIndex].name;
      clearPaint();
      outlineImg.onload=()=>{ drawOutline(); };
      outlineImg.src=fruitList[currentFruitIndex].src;
    }

    function prevFruit(){ loadFruit(currentFruitIndex-1); }
    function nextFruit(){ loadFruit(currentFruitIndex+1); }
    function clearPaint(){ paintCtx.clearRect(0,0,paintCanvas.width,paintCanvas.height); }

    colorPicker.addEventListener('input',e=>{ brushColor=e.target.value; });

    paintCanvas.addEventListener('mousedown',startDraw);
    paintCanvas.addEventListener('mousemove',paint);
    paintCanvas.addEventListener('mouseup',endDraw);
    paintCanvas.addEventListener('mouseout',endDraw);
    paintCanvas.addEventListener('touchstart',e=>startDraw(e.touches[0]));
    paintCanvas.addEventListener('touchmove',e=>{ e.preventDefault(); paint(e.touches[0]); });
    paintCanvas.addEventListener('touchend',endDraw);

    function startDraw(e){
      drawing=true;
      paintCtx.beginPath();
      paint(e);
    }

    function paint(e){
      if(!drawing) return;
      const rect=paintCanvas.getBoundingClientRect();
      const x=e.clientX-rect.left;
      const y=e.clientY-rect.top;
      paintCtx.lineWidth=brushSize;
      paintCtx.lineCap='round';
      paintCtx.strokeStyle=brushColor;
      paintCtx.lineTo(x,y);
      paintCtx.stroke();
      paintCtx.beginPath();
      paintCtx.moveTo(x,y);
    }

    // === Tambahan fungsi Masking ===
    function applyMask() {
      const maskCanvas = document.createElement('canvas');
      const maskCtx = maskCanvas.getContext('2d');
      maskCanvas.width = outlineCanvas.width;
      maskCanvas.height = outlineCanvas.height;

      // gambar outline ke mask
      maskCtx.drawImage(outlineCanvas, 0, 0);

      // ambil data pixel
      const imgData = maskCtx.getImageData(0, 0, maskCanvas.width, maskCanvas.height);
      const data = imgData.data;

      // alpha: hanya area non-putih yg dipertahankan
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        if (r < 250 || g < 250 || b < 250) {
          data[i+3] = 255; // penuh
        } else {
          data[i+3] = 0;   // transparan
        }
      }
      maskCtx.putImageData(imgData, 0, 0);

      // gabungkan dengan hasil coretan
      const temp = document.createElement('canvas');
      temp.width = paintCanvas.width;
      temp.height = paintCanvas.height;
      const tempCtx = temp.getContext('2d');
      tempCtx.drawImage(paintCanvas, 0, 0);

      tempCtx.globalCompositeOperation = 'destination-in';
      tempCtx.drawImage(maskCanvas, 0, 0);

      paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      paintCtx.drawImage(temp, 0, 0);
    }

    function endDraw(e){
      if(!drawing) return;
      drawing=false;
      paintCtx.closePath();
      applyMask(); // <--- Tambahan supaya coretan tidak keluar dari buah
    }

    loadFruit(0);
    resizeCanvas();
  </script>
</body>
</html>
